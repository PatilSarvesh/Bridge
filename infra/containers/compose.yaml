name: bridge-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
    ports:
      - "${BRIDGE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - bridge-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12

  object-storage:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: ${BRIDGE_OBJECT_STORAGE_ACCESS_KEY:-bridge-local}
      MINIO_ROOT_PASSWORD: ${BRIDGE_OBJECT_STORAGE_SECRET_KEY:-bridge-local-dev-only}
    command: server /data --console-address ":9001"
    ports:
      - "${BRIDGE_OBJECT_STORAGE_PORT:-9000}:9000"
      - "${BRIDGE_OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - bridge-object-storage-data:/data

volumes:
  bridge-postgres-data:
  bridge-object-storage-data:

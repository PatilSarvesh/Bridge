name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge@127.0.0.1:5432/bridge_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile isolated PostgreSQL role contract
        run: |
          DATABASE_URL="$BRIDGE_TEST_DATABASE_URL" pnpm --filter @bridge/database db:migrate
          psql "$BRIDGE_TEST_DATABASE_URL" \
            -v bridge_migrator_role=bridge_migrator \
            -v bridge_runtime_role=bridge_runtime \
            -v bridge_maintenance_role=bridge_maintenance \
            -f scripts/provision-postgres-roles.sql

      - name: Run typecheck, tests, and production builds
        run: pnpm check
